# Netlify previews the Astro site from dev. Set Netlify's production branch to
# dev; the live apex is published from main by GitHub Pages Actions.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep the preview out of search engines so it never competes with the real site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
