# Keeps npm dependencies and pinned action SHAs current. PRs target dev
# so updates ride the normal dev integration + Netlify preview flow instead of
# landing straight on main (= live).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
