name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages — the live source for
# the apex (burningsuit.co.uk). Runs on push to main and on manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the OIDC Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # withastro/action runs npm ci + astro build and uploads dist/ as the
      # Pages artifact. Node 22 to match .nvmrc / package.json engines.
      - name: Build Astro site
        uses: withastro/action@v4
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
