name: Deploy to GitHub Pages

# Test the single static artifact before publishing it to the live apex.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Only a push or dispatch on main receives the secret and builds the priced site. Any other ref (a dispatch from a branch)
      # never reads the secret, builds the Price on request variant and cannot deploy (the deploy job is main-only).
      # The writer validates without printing, registers each rate as a masked value and sets SHOW_TRAINING_PRICES for later steps.
      - name: Prepare private training prices
        if: github.ref == 'refs/heads/main'
        env:
          TRAINING_PRICES_JSON: ${{ secrets.TRAINING_PRICES_JSON }}
        run: node scripts/write-training-prices.mjs
      # Output of priced steps passes through the masking runner; failures print structure only, and no test artifacts are uploaded.
      - name: Check, build and validate the site
        run: node scripts/run-masked.mjs npm run gate
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      # Functional checks serve the same fresh artifact that is uploaded below. A priced slot reading Price on request fails the run.
      - name: Test the built artifact
        run: node scripts/run-masked.mjs npm run test:functional
      - name: Reject unfinished rebuilds
        run: npm run check:release
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Nothing rebuilds or changes dist/ between the tests and this upload.
      - name: Upload the tested artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true # Preserve the generated .nojekyll file.
      # Runs on every outcome, including a failed or blocked run, so the private input never outlives the job.
      - name: Remove private training prices
        if: always()
        run: rm -f design/copy/training-prices.json

  deploy:
    needs: build
    # A manual dispatch from another branch must never publish to the apex.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tell Bing and the other IndexNow engines to recrawl the live sitemap. It runs after the site is live, never
  # touches the artifact, and a failure here leaves the deploy itself successful.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Submit the sitemap to IndexNow
        run: node scripts/indexnow.mjs
