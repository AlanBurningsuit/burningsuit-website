name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages — the live source for
# the apex (burningsuit.co.uk). Runs on push to main and on manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the OIDC Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # withastro/action installs deps and runs `npm run build` by default —
      # i.e. the FULL pipeline (prep:images → astro build → check:budget), so
      # the byte budget gates production deploys too. Node 22 to match
      # .nvmrc / package.json engines.
      - name: Build Astro site
        uses: withastro/action@a4407e937037e68022f04ae1c068d3634f08bc8d # v4.2.1
        with:
          node-version: 22

  deploy:
    needs: build
    # In-repo guard against a manual dispatch from dev/feature branches
    # publishing an unreleased site to the apex. (The github-pages
    # environment's branch policy also blocks this by default, but that's an
    # out-of-repo setting nobody can see in review.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
