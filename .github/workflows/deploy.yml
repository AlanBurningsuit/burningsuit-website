name: Deploy to GitHub Pages

# Test the single static artifact before publishing it to the live apex.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, build and validate the site
        run: npm run gate
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      # test:functional type-checks tests and serves the existing dist/. Windows
      # visual baselines are platform-specific, so screenshot tests stay local.
      - name: Test the built artifact
        run: npm run test:functional
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Nothing rebuilds or changes dist/ between the tests and this upload.
      - name: Upload the tested artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true # Preserve the generated .nojekyll file.

  deploy:
    needs: build
    # A manual dispatch from another branch must never publish to the apex.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
