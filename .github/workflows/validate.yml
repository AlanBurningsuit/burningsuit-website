name: Validate the static site

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Validation cannot deploy or publish.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, build and validate the site
        run: npm run gate
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      # Functional checks serve the fresh artifact produced by the gate.
      - name: Test the built artifact
        run: npm run test:functional
