name: Validate the static site

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Validation cannot deploy or publish.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, build and validate the site
        run: npm run gate
      - name: Install Playwright Chromium, WebKit and OS dependencies
        run: npx playwright install --with-deps chromium webkit
      # Functional checks serve the fresh artifact produced by the gate; the WebKit smoke project runs here too.
      - name: Test the built artifact
        run: npm run test:functional
      - name: Check the build is fit to release
        run: npm run check:release
